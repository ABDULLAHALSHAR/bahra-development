<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>منصة بحرة إلكتريك لتطوير الموظفين</title>
<style>
/* ===== Bahra Electric — Design Tokens (matched to brand screenshots) ===== */
:root{
  --red:#E01F26; --red-2:#C4131A; --red-dark:#A50E14; --red-soft:#FDECEC;
  --ink:#181B20; --ink-2:#3A3F47; --muted:#6B7280; --muted-2:#9AA1AC;
  --line:#E7E9EE; --line-2:#EEF0F4;
  --bg:#F3F4F7; --card:#FFFFFF; --panel:#FFFFFF;
  --hero:#14161B; --hero-2:#22262E;
  --ok:#12B76A; --ok-soft:#E7F7EF; --warn:#F79009; --warn-soft:#FEF3E2;
  --info:#2E90FA; --info-soft:#EAF3FF; --gold:#8B5CF6; --gold-soft:#F1ECFE;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --shadow-lg:0 12px 40px rgba(16,24,40,.14);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --side:262px; --top:70px;
  --font:"Segoe UI","Tahoma",-apple-system,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --ink:#F2F4F8; --ink-2:#C9CFDA; --muted:#98A0AE; --muted-2:#727A88;
  --line:#2A2F38; --line-2:#242932;
  --bg:#0E1014; --card:#181B21; --panel:#15181E;
  --red-soft:#2A1416; --line-2:#22262E;
  --ok-soft:#10241A; --warn-soft:#2A1E0C; --info-soft:#0F1E30; --gold-soft:#1C1630;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 16px 44px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;font-size:14px;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--red);color:#fff}
.hidden{display:none !important}

/* real brand logo image */
.logo-img{height:44px;width:auto;display:block}
.brand .logo-img,.login-form .logo-img{height:46px}
.hero .logo-img{height:40px}

/* ===== Brand logo mark ===== */
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:40px;height:40px;border-radius:50% 50% 50% 8px;
  background:linear-gradient(140deg,var(--red),var(--red-dark));position:relative;flex:0 0 auto;
  box-shadow:0 4px 12px rgba(224,31,38,.4)}
.logo .mark::before{content:"";position:absolute;inset:9px 8px;
  border-right:3.5px solid #fff;border-bottom:3.5px solid #fff;border-radius:0 0 6px 0;
  transform:skewX(-8deg)}
.logo .mark::after{content:"";position:absolute;left:8px;top:8px;width:7px;height:7px;
  background:#fff;border-radius:50%}
.logo .txt{line-height:1}
.logo .txt b{font-size:20px;font-weight:800;letter-spacing:.5px;color:var(--ink);display:block}
.logo .txt span{font-size:10px;font-weight:700;letter-spacing:3px;color:var(--red)}
.logo .tag{font-size:8px;font-weight:600;letter-spacing:1.2px;color:var(--muted);margin-top:3px}

/* ===== LOGIN ===== */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#f6f6f8,#eceef2);
  display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto}
#login::before,#login::after{content:"";position:fixed;width:340px;height:340px;
  background:linear-gradient(135deg,var(--red),var(--red-dark));z-index:0;opacity:.9}
#login::before{top:-150px;left:-150px;transform:rotate(45deg);clip-path:polygon(0 0,100% 0,0 100%)}
#login::after{bottom:-150px;right:-150px;transform:rotate(45deg);clip-path:polygon(100% 100%,100% 0,0 100%)}
.login-card{position:relative;z-index:2;width:min(1120px,100%);min-height:560px;background:var(--card);
  border-radius:26px;box-shadow:var(--shadow-lg);display:grid;grid-template-columns:1.55fr 1fr;overflow:hidden}
html[dir="rtl"] .login-card{grid-template-columns:1fr 1.55fr}
.login-promo{position:relative;overflow:hidden;min-height:560px;padding:0}
html[dir="rtl"] .login-promo{order:2}
.login-promo .promo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.login-promo .reels{position:absolute;inset:0;z-index:-1;opacity:.5;
  background:
   radial-gradient(circle at 80% 78%,rgba(224,31,38,.5),transparent 34%),
   radial-gradient(circle at 25% 25%,rgba(255,210,140,.28),transparent 40%),
   repeating-linear-gradient(115deg,#2a1c18 0 44px,#3a2620 44px 88px)}
.login-promo h1{font-size:34px;font-weight:800;line-height:1.25;margin-bottom:6px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.login-promo h1 .hl{color:#ff5a60}
.login-promo .sub-en{font-size:13px;font-weight:600;opacity:.9;letter-spacing:.3px}
.login-promo .divider{width:56px;height:3px;background:var(--red);border-radius:3px;margin:20px 0 14px}
.login-promo .desc{font-size:15px;opacity:.92;max-width:340px;line-height:1.7}
.login-promo .logo .txt b{color:#fff}.login-promo .logo .tag{color:rgba(255,255,255,.75)}
.promo-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
.promo-cards .pc{background:rgba(20,20,24,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:16px 10px;text-align:center}
.promo-cards .pc .ic{width:40px;height:40px;border-radius:11px;background:var(--red);
  display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:19px}
.promo-cards .pc span{font-size:12px;font-weight:700}
.login-form{padding:52px 46px;display:flex;flex-direction:column;justify-content:center;position:relative}
html[dir="rtl"] .login-form{order:1}
.login-form .lang-top{position:absolute;top:20px;inset-inline-end:22px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink-2)}
